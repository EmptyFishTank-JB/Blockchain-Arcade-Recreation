<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0d1b16"/>
      <stop offset="100%" stop-color="#020403"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- a board cell, drawn inside the maskable safe zone -->
  <rect x="116" y="116" width="280" height="280" rx="18" fill="#06140d" stroke="#39ff8f" stroke-width="10" filter="url(#glow)"/>
  <text x="256" y="302" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="150" letter-spacing="-6" filter="url(#glow)"><tspan fill="#39ff8f">B</tspan><tspan fill="#ffd166">F</tspan></text>
  <!-- a bit falling in -->
  <rect x="226" y="52" width="60" height="40" rx="6" fill="#06140d" stroke="#39ff8f" stroke-width="5" opacity="0.8"/>
</svg>
